<style>
  :root {
    --ink: #1f2426;
    --ink-soft: #5a6061;
    --ink-mute: #9aa1a3;
    --paper: #fbfaf7;
    --paper-2: #f4f2ec;
    --rule: #d8d3c8;
    --rule-soft: #e8e4da;
    --planned: #1967d2;
    --planned-tint: #f5f9ff;
    --planned-rule: #c5d9f7;
    --actual: #0d6b63;
  }
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Inter', sans-serif; }
  * { box-sizing: border-box; }
  .dc-card { background: #fff; border-radius: 14px; }
  .intro {
    padding: 32px 40px 12px;
    color: #2a251f;

  .intro h1 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .intro p {
    margin: 0;
    color: rgba(40,30,20,0.65);
    font-size: 14px;
    line-height: 1.5;
    max-width: 640px;
  }
  .intro .legend {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: rgba(60,50,40,0.6);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .intro .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .intro .legend i {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--rule);
    display: inline-block;
  }
