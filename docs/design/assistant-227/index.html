<!doctype html>
<!-- THROWAWAY: Three Android Assistant structures on one browser route, ?variant=A/B/C. No backend or persistent state. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant · Design review 227</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e9e9;color:#25292b;font:15px/1.55 system-ui,sans-serif}button,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a68413;outline-offset:3px}button{min-height:44px;border:0;border-radius:12px;padding:8px 13px;background:transparent;color:inherit}button:hover{background:#8882}aside{position:absolute;left:6vw;top:65px;width:270px}h1{font-size:32px;font-weight:450;line-height:1.2}h2{font-size:26px;font-weight:450;line-height:1.25;margin:10px 0}p{margin:10px 0 18px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700}.muted{color:var(--muted,#62696b)}aside label{display:block;margin:18px 0 5px}select{width:100%;padding:10px;border-radius:9px;border:1px solid #b5bcbc;background:white}aside pre{white-space:pre-wrap;font:12px/1.6 monospace;background:#fff8;padding:12px;border-radius:10px}.phone{--bg:#f9f9f9;--card:#eef1f1;--line:#d9dede;--text:#25292b;--muted:#62696b;--accent:#f3dc83;position:relative;display:flex;flex-direction:column;width:390px;height:790px;max-height:calc(100dvh - 115px);margin:25px auto 90px;background:var(--bg);color:var(--text);border:1px solid #c1c7c7;border-radius:28px;overflow:hidden;box-shadow:0 22px 70px #26343420}.phone.dark{--bg:#191c1d;--card:#282d2f;--line:#3e4547;--text:#eef1f2;--muted:#afb9bd;--accent:#685721}.statusbar{padding:10px 22px 3px;font-size:12px;display:flex;justify-content:space-between}header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between}.top h2{margin:0}.new{font-size:12px;border:1px solid var(--line)}.context{font-size:12px;padding:5px 0 0}main{flex:1;overflow:auto;padding:22px 18px;scroll-behavior:smooth}.question{padding:12px 15px;background:var(--card);border-radius:17px 17px 3px 17px;margin:0 0 24px 42px}.answer{margin-bottom:30px}.answer p{margin:8px 0 14px}.answer ul{padding-left:20px}.answer li{margin:10px 0}.stamp{font-size:11px;font-weight:650;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}.progress{font-size:12px;color:var(--muted);margin:12px 0}.progress.busy:before{content:'●';color:#aa8b24;margin-right:7px}.notice{border-left:3px solid #bda04b;background:var(--card);padding:10px 12px;font-size:13px;margin:14px 0}.notice button{font-weight:650;padding-left:0}.starter{display:block;width:100%;text-align:left;background:var(--card);margin:9px 0;padding:14px}.welcome{padding-top:36px}.welcome .mark{font-size:32px;margin-bottom:20px}.welcome p{font-size:14px;color:var(--muted)}.composer{margin:0 12px 10px;padding:9px;border:1px solid var(--line);border-radius:18px;background:var(--card);display:flex;align-items:flex-end;gap:5px}textarea{resize:none;min-height:44px;max-height:110px;width:100%;background:transparent;color:inherit;border:0;padding:10px 4px;outline:none;line-height:1.4}.send{background:var(--text);color:var(--bg);min-width:48px;border-radius:12px}.send:disabled{opacity:.35}.counter{font-size:11px;text-align:right;padding:0 20px 6px}nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 4px 12px;font-size:10px}nav span{text-align:center;padding:5px 7px}nav b{display:block;font-size:18px;font-weight:400}nav .active{background:var(--accent);border-radius:13px}.keyboard{height:180px;background:var(--card);padding:20px 12px;text-align:center;letter-spacing:9px;line-height:2.5;border-top:1px solid var(--line);font-size:16px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#23292c;color:white;border-radius:40px;display:flex;align-items:center;padding:5px;box-shadow:0 8px 25px #0003;white-space:nowrap;z-index:10}.switcher span{min-width:215px;text-align:center;font-size:13px}.brief{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 23px}.brief-title{background:var(--accent);padding:13px 16px}.brief-body{padding:10px 16px}.slot{display:grid;grid-template-columns:85px 1fr;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.slot:last-child{border:0}.slot small{display:block;color:var(--muted)}.variant-B .question{margin-left:0;background:transparent;border-left:2px solid var(--line);border-radius:0;padding-left:12px;font-size:14px}.variant-C main{padding:0 22px}.variant-C .question{margin:22px 0 14px;background:transparent;padding:0;border-radius:0;font-size:23px;line-height:1.35;font-weight:450}.variant-C .answer{border-bottom:1px solid var(--line);padding-bottom:25px}.variant-C .stamp{margin-top:24px}.variant-C header{border-bottom:3px double var(--line)}.latest{position:absolute;bottom:155px;right:18px;background:var(--text);color:var(--bg);box-shadow:0 3px 12px #0002;font-size:12px}.review-note{position:absolute;right:5vw;top:80px;width:240px;font-size:14px;color:#535e61}@media(max-width:1100px){.review-note{display:none}aside{left:20px;width:210px}.phone{margin-left:calc(50% - 100px)}}@media(max-width:750px){aside{position:static;width:auto;margin:20px}aside h1,aside>p,aside pre,aside .eyebrow{display:none}aside label{display:inline;margin-right:10px}aside select{width:auto;max-width:180px}.phone{margin:15px auto 95px;max-width:calc(100% - 24px);height:740px;max-height:none}.switcher{bottom:10px}} 
</style>
<aside><div class="eyebrow">Timebox / Issue 227</div><h1>A little clarity<br>for today.</h1><p>Three directions for Assistant.<br>Throwaway prototype · sample data.</p><label for="scene">Review state</label><select id="scene"><option value="answer">Completed answer</option><option value="empty">Empty</option><option value="streaming">Streaming</option><option value="interrupted">Interrupted</option><option value="expired">Expired</option><option value="limit">Conversation limit</option><option value="long">Long conversation</option></select><p><label><input id="dark" type="checkbox"> Dark theme</label><label><input id="keyboard" type="checkbox"> Simulated keyboard</label><label><input id="large" type="checkbox"> Larger text</label></p><pre id="state"></pre></aside>
<section class="phone" id="phone" aria-label="Android Assistant prototype"></section><div class="review-note" id="notes"></div><div class="switcher"><button id="prev" aria-label="Previous design">←</button><span id="variant-label"></span><button id="next" aria-label="Next design">→</button></div>
<script>
const names={A:'Conversation',B:'Daily briefing',C:'Notebook'},notes={A:'A — Conversation\n\nThe familiar option. Compact user bubbles and open answers prioritize follow-up questions.\n\nRecommended starting point: strongest fit for a general conversation.',B:'B — Daily briefing\n\nA structured plan summary leads the response; discussion sits below. Strong scanning, but more visually dense.\n\nCards here illustrate presentation only; production structured output would need a separate scope decision.',C:'C — Notebook\n\nQuestions become section headings. A quiet document rhythm prioritizes reading and reflection over chat bubbles.\n\nCompare how easily you distinguish the speakers in a long conversation.'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';let scene='answer',draft='',timer,run=0,custom='',partial='',busy=false;
const phone=document.querySelector('#phone'),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const answer='<p>You have <strong>3 Planned Blocks</strong> today, totaling <strong>3 hours</strong>.</p><ul><li><strong>09:00–10:30 · Design review</strong><br>Work / Product</li><li><strong>11:00–12:00 · Build the prototype</strong><br>Work / Development</li><li><strong>14:00–14:30 · Read</strong><br>Personal / Learning</li></ul><p>There’s a 30-minute gap between your morning blocks, and two hours before reading.</p>';
const brief='<section class="brief"><div class="brief-title"><span class="eyebrow">Today’s plan</span><br><strong>3 blocks · 3 hours planned</strong></div><div class="brief-body"><div class="slot"><span>09:00–10:30</span><div>Design review<small>Work / Product</small></div></div><div class="slot"><span>11:00–12:00</span><div>Build the prototype<small>Work / Development</small></div></div><div class="slot"><span>14:00–14:30</span><div>Read<small>Personal / Learning</small></div></div></div></section>';
function exchange(q,body){return `<div class="question">${esc(q)}</div><article class="answer"><div class="stamp">ASSISTANT</div>${body}</article>`}
function render(){busy=scene==='streaming';phone.className='phone variant-'+variant+(document.querySelector('#dark').checked?' dark':'');phone.style.fontSize=document.querySelector('#large').checked?'19px':'';
let content='';if(scene==='empty')content=`<div class="welcome"><div class="mark">✳</div><h2>A little clarity<br>for today</h2><p>Explore today’s Planned Blocks. Assistant can read your plan but can’t change it.</p>${['What have I planned for today?','Where are the gaps in today’s plan?','Summarize my planned activities.'].map(x=>`<button class="starter">${x}</button>`).join('')}</div>`;
else{let body=scene==='streaming'?'<div class="progress busy" role="status">'+(partial?'Writing response…':'Reading today’s plan…')+'</div><p id="partial">'+esc(partial)+'</p>':scene==='interrupted'?'<p>'+esc(partial || 'You have 3 Planned Blocks today, totaling 3 hours. Your morning starts with design review…')+'</p><div class="notice">Response interrupted. This partial answer won’t be used as context.<br><button id="retry">Retry response ↻</button></div>':variant==='B'?brief+'<p>Your morning has a 30-minute gap. There are two hours between your second block and reading.</p>':answer;
content=exchange(custom||'What have I planned for today?',body);if(scene==='long')content+=exchange('How much time is planned before lunch?','<p><strong>2 hours 30 minutes</strong> before noon: 90 minutes for design review and 60 minutes for the prototype.</p>')+exchange('Where could I take a break?', '<p>The gap from <strong>10:30 to 11:00</strong> gives you 30 minutes between your morning blocks.</p><p>You also have an unplanned stretch from noon until 14:00. These are gaps in your plan; they don’t indicate how you actually spent that time.</p>');if(scene==='expired'||scene==='limit')content+=`<div class="notice">${scene==='expired'?'This conversation has expired.':'You’ve reached 20 completed exchanges.'} Start a new conversation to continue.<br><button class="reset">Start new conversation →</button></div>`;}
phone.innerHTML=`<div class="statusbar"><span>9:41</span><span>▰ ▰ ▰</span></div><header><div class="top"><h2>Assistant</h2><button class="new reset">New conversation</button></div><details class="context muted"><summary>Temporary conversation</summary>Starts fresh after an app restart or 60 minutes of inactivity. Up to 20 completed exchanges.</details></header><main>${content}</main><button class="latest" hidden>↓ Jump to latest</button><div class="counter muted" hidden></div><div class="composer"><textarea aria-label="Message Assistant" placeholder="Ask about today’s plan" rows="1" maxlength="4000" ${['expired','limit'].includes(scene)?'disabled':''}>${esc(draft)}</textarea><button class="send" aria-label="${busy?'Stop response':'Send message'}" ${!busy&&!draft.trim()?'disabled':''}>${busy?'■':'↑'}</button></div><nav aria-label="Timebox navigation context"><span><b>▤</b>Battle Plan</span><span><b>▦</b>Day</span><span><b>◷</b>Chronicle</span><span class="active"><b>✳</b>Assistant</span></nav>${document.querySelector('#keyboard').checked?'<div class="keyboard" aria-label="Simulated keyboard">q w e r t y u i o p<br>a s d f g h j k l<br>⇧ z x c v b n m ⌫</div>':''}`;
document.querySelector('#variant-label').textContent=variant+' — '+names[variant];document.querySelector('#notes').innerText=notes[variant];document.querySelector('#state').textContent=JSON.stringify({variant,scene,busy,theme:document.querySelector('#dark').checked?'dark':'light',keyboard:document.querySelector('#keyboard').checked,data:'fixture only; no API calls'},null,2);
phone.querySelectorAll('.reset').forEach(b=>b.onclick=()=>{clearInterval(timer);run++;scene='empty';custom='';draft='';partial='';sync()});phone.querySelectorAll('.starter').forEach(b=>b.onclick=()=>{draft=b.textContent;render();phone.querySelector('textarea').focus()});let input=phone.querySelector('textarea');input.oninput=()=>{draft=input.value;input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px';phone.querySelector('.send').disabled=!busy&&!draft.trim();let counter=phone.querySelector('.counter');counter.hidden=draft.length<3600;counter.textContent=draft.length+'/4000'};phone.querySelector('.send').onclick=()=>{if(busy){clearInterval(timer);run++;scene='interrupted';sync()}else if(draft.trim()){custom=draft;draft='';stream()}};phone.querySelector('#retry')?.addEventListener('click',stream);const main=phone.querySelector('main'),latest=phone.querySelector('.latest');main.onscroll=()=>{latest.hidden=main.scrollHeight-main.scrollTop-main.clientHeight<70};latest.onclick=()=>{main.scrollTop=main.scrollHeight};}
function sync(){document.querySelector('#scene').value=scene;render()}
function stream(){clearInterval(timer);let token=++run;scene='streaming';partial='';sync();let words='You have 3 Planned Blocks today, totaling 3 hours. Your first block is Design review, from 09:00 to 10:30. Next is Build the prototype, from 11:00 to 12:00. Reading is planned for 14:00–14:30.'.split(' '),i=0;timer=setInterval(()=>{if(token!==run)return;const m=phone.querySelector('main'),follow=m.scrollHeight-m.scrollTop-m.clientHeight<70;partial+=words[i++]+' ';phone.querySelector('#partial').textContent=partial;if(follow)m.scrollTop=m.scrollHeight;if(i===words.length){clearInterval(timer);scene='answer';sync()}},170)}
function cycle(n){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3];let url=new URL(location);url.searchParams.set('variant',variant);history.replaceState({},'',url);render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.onkeydown=e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)};document.querySelector('#scene').onchange=e=>{clearInterval(timer);run++;scene=e.target.value;custom='';partial='';if(scene==='streaming')stream();else sync()};['dark','keyboard','large'].forEach(id=>document.getElementById(id).onchange=render);render();
</script></html>
