[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timebox-backend"
version = "0.1.0"
description = "Hourly timebox API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "tzdata>=2024.1",
  "langchain>=1.4.2",
  "langgraph>=1.2.11",
  "langchain-openrouter>=0.2.8",
  "arize-phoenix-otel>=0.17.1",
  "openinference-instrumentation-langchain>=0.1.76",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.uv]
required-version = ">=0.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
