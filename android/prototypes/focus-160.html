<style>

*{box-sizing:border-box}body{margin:0;background:#dedbd5;color:#242521;font:14px Inter,system-ui}button,input,select{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:24px;padding:0 20px;background:transparent;color:inherit}button:hover{filter:brightness(.9)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #aa7b20;outline-offset:3px}.review{position:fixed;left:40px;top:44px;width:260px}.review h1{font:32px Manrope;margin:16px 0}.review p{line-height:1.7;color:#66675f}.review label{display:block;margin:18px 0 6px}.review select{width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;background:#f8f7f3}.review pre{font:11px/1.7 monospace;white-space:pre-wrap}.phone{width:412px;height:min(852px,calc(100dvh - 120px));margin:24px auto 100px;border:8px solid #272823;border-radius:44px;overflow:hidden;box-shadow:0 20px 65px #35392e33;position:relative;background:var(--bg);color:var(--on);--bg:#f8f8f3;--on:#252722;--muted:#6a7065;--line:#dedfd5;--accent:#0d6b63;--panel:#eeefe7}.phone.dark{--bg:#101512;--on:#e8eee7;--muted:#a3afa5;--line:#303b33;--accent:#87cdb4;--panel:#1b251e}.status{height:30px;padding:10px 24px 0;font-size:11px;display:flex;justify-content:space-between}.app{height:calc(100% - 30px);display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;flex-shrink:0}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:600}.exit{border:1px solid var(--line);padding:0 16px;font-size:12px}.content{overflow:auto;flex:1;padding:20px 24px 12px}.title{font:300 37px/1.15 Manrope;letter-spacing:-1.5px;margin:16px 0}.muted{color:var(--muted);line-height:1.6;font-size:13px}.time{font:300 54px Manrope;letter-spacing:-2px;font-variant-numeric:tabular-nums}.subtasks{margin-top:26px}.subtasks label{display:flex;align-items:center;gap:12px;min-height:51px;font-size:13px;line-height:1.5;border-bottom:1px solid var(--line)}input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}.checked{text-decoration:line-through;color:var(--muted)}.complete{margin-top:16px;border:1px solid var(--line);width:100%;font-size:12px}.footer{padding:14px 24px 25px;flex-shrink:0}.footer .switch{background:var(--panel);width:100%;font-size:13px}.live{color:var(--accent);font-size:11px}.live:before{content:'●';margin-right:6px}.footer small{display:block;text-align:center;font-size:10px;color:var(--muted);margin-top:12px}.A .content{padding-top:40px}.A .elapsed{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--line);margin-top:25px;padding-top:16px}.A .time{font-size:32px}.B .content{text-align:center;padding-top:16px}.B .orb{border:1px solid var(--line);border-radius:50%;width:198px;height:198px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:12px auto 28px;box-shadow:0 0 70px #87cdb409}.B .title{font-size:30px}.B .subtasks{text-align:left;margin-top:15px}.B details summary{padding:18px 0;cursor:pointer;color:var(--muted);font-size:12px}.C .content{padding-top:8px}.C .hero{padding:20px;background:var(--panel);border-radius:22px}.C .title{font-size:30px;margin:12px 0}.C .elapsed{display:flex;justify-content:space-between;align-items:center}.C .time{font-size:27px}.C .subtasks{margin-top:28px}.C .subtasks label{min-height:62px}.notice{background:var(--panel);border-radius:14px;padding:14px;margin:12px 0;font-size:12px;line-height:1.5}.notice button{padding:0 10px;font-size:12px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:#232922;color:#fff;border-radius:32px;box-shadow:0 8px 30px #0003;white-space:nowrap;z-index:5}.switcher span{min-width:200px;text-align:center;font-size:12px}.switcher button{font-size:20px}.entry{margin-top:130px}.form input{width:100%;padding:14px;background:var(--bg);color:var(--on);border:1px solid var(--line);border-radius:10px;margin:12px 0}.form button{background:var(--panel)}.plan{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px}.plan button{padding:0;color:var(--accent)}

<aside class="review"><div class="eyebrow">Issue 160 · Android only</div><h1>Room to focus.</h1><p>Three throwaway directions inspired by legacy Work Mode. Compare the activity, elapsed time, and Subtask hierarchy.</p><label for="scene">Preview state</label><select id="scene"><option value="task">Linked Battle Plan Task</option><option value="unknown">Unnamed activity</option><option value="checkin">Inactivity Prompt</option><option value="plan">Different Planned Block</option><option value="offline">Offline / unsynced</option><option value="long">Long title & Subtasks</option></select><button id="theme">Toggle light / dark</button><details><summary>Prototype state · no saved changes</summary><pre id="state"></pre></details><p id="direction"></p></aside>
<section id="phone" class="phone"><div class="status"><span>9:41</span><span>▰ ▰ ●</span></div><div id="app" class="app"></div></section>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="label"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const names={A:'Editorial canvas',B:'Quiet clock',C:'Task companion'}, directions={A:'Activity first. Open space and light typography carry the legacy design forward.',B:'Time first. A quiet elapsed clock for a display left visible while working. Subtasks expand on demand.',C:'Task first. A compact activity panel makes room for the checkpoints you are working through.'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let scene='task',dark=false,focus=true,completed=false,checked=[true,false,false],switching=false,activity='Shape the onboarding story',confirmed=false;
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function task(){if(scene==='unknown')return '';const titles=scene==='long'?['Review every first-run screen and document the moments where the user has to stop and think','Sketch an alternative for the permissions and account setup sequence','Write clear acceptance criteria for the final handoff']:['Map the first five minutes','Sketch the welcome sequence','Write the handoff notes'];return `<section class="subtasks"><div class="eyebrow">Subtasks · ${checked.filter(Boolean).length} / 3</div>${titles.map((t,i)=>`<label class="${checked[i]?'checked':''}"><input type="checkbox" data-check="${i}" ${checked[i]?'checked':''} ${completed?'disabled':''}>${t}</label>`).join('')}<button class="complete" data-action="complete">${completed?'Undo Task completion':'Complete Task'}</button></section>`}
function render(){const title=scene==='unknown'?'What are you doing?':scene==='long'?'Design a calmer first experience for people setting up their workspace':activity;const identity=`<div class="eyebrow">${scene==='unknown'?'Current Activity':'Product design'}</div><h1 class="title">${escape(title)}</h1><p class="muted">${scene==='unknown'?'You can name this whenever you’re ready. Recording continues.':'Make the first five minutes feel effortless.'}</p>`;const timer=`<div class="elapsed"><span class="time">24:18</span><span class="muted">elapsed</span></div>`;
let body=variant==='A'?`${identity}${timer}${task()}`:variant==='B'?`<div class="orb"><span class="time">24:18</span><span class="muted">elapsed · since 09:17</span></div>${identity}${scene==='unknown'?'':`<details><summary>Battle Plan Task · ${completed?'Completed':checked.filter(Boolean).length+' of 3 Subtasks'} ↓</summary>${task()}</details>`}`:`<div class="hero">${identity}${timer}</div>${task()}`;
let notice='';if(scene==='checkin'&&!confirmed)notice='<div class="notice"><b>Still doing this?</b><p>Recording continues while you decide.</p><button data-action="confirm">Yes, still doing this</button><button data-action="dismiss">Not now</button></div>';if(scene==='offline')notice='<div class="notice">Offline · changes waiting to sync.<br>Activity Tracking continues on this device.</div>';if(scene==='plan')body+='<div class="plan"><span class="muted">Planned now · 09:30–10:00</span><p>Review the launch checklist</p><button data-action="adopt">Switch to planned activity →</button></div>';
document.getElementById('phone').className=`phone ${variant} ${dark?'dark':''}`;
document.getElementById('app').innerHTML=focus?`<header class="header"><div><div class="eyebrow">Focus</div>${scene==='checkin'&&confirmed?'<div class="muted">Check-in waiting</div>':''}</div><button class="exit" data-action="exit">Exit Focus ↗</button></header><main class="content">${notice}${switching?`<form class="form"><div class="eyebrow">Current Activity</div><h1 class="title">${scene==='unknown'?'Name this moment':'Switch activity'}</h1><label>Block Name<input name="name" autofocus placeholder="What are you doing?" required maxlength="500"></label><p class="muted">${scene==='unknown'?'Task Type · unspecified':'Task Type · Product design'}</p><button type="submit">${scene==='unknown'?'Save name':'Switch activity'}</button><button type="button" data-action="cancel">Cancel</button></form>`:body}</main><footer class="footer"><button class="switch" data-action="switch">${scene==='unknown'?'Name activity':'Switch activity'} ↗</button><small>${scene==='offline'?'Offline · unsynced':'Synced'} · Keep display awake</small></footer>`:`<main class="content entry"><div class="eyebrow">Day · Saturday, 12 September</div><h1 class="title">Back in your day.</h1><p class="muted">Focus is closed. Activity Tracking is still running.</p><div class="notice"><span class="live">Recording · 24:18</span><p>${escape(activity)}</p></div><button class="complete" data-action="enter">Return to Focus</button></main>`;
document.getElementById('label').textContent=variant+' — '+names[variant];document.getElementById('direction').textContent=directions[variant];document.getElementById('state').textContent=JSON.stringify({variant,platform:'Android concept',scene,focus,tracking:true,activity,completed,checked,dark,switching,confirmed,elapsed:'24:18 (frozen sample)'},null,2);
}
function cycle(delta){variant='ABC'[('ABC'.indexOf(variant)+delta+3)%3];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('theme').onclick=()=>{dark=!dark;render()};document.getElementById('scene').onchange=e=>{scene=e.target.value;focus=true;confirmed=false;switching=false;completed=false;checked=[true,false,false];render()};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});
document.getElementById('app').onclick=e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='exit')focus=false;if(action==='enter')focus=true;if(action==='complete')completed=!completed;if(action==='switch')switching=true;if(action==='cancel')switching=false;if(action==='confirm'){scene='task';confirmed=false}if(action==='dismiss')confirmed=true;if(action==='adopt'){activity='Review the launch checklist';scene='task'}render()};
document.getElementById('app').onchange=e=>{if(e.target.dataset.check!==undefined){checked[Number(e.target.dataset.check)]=e.target.checked;render()}};
document.getElementById('app').onsubmit=e=>{e.preventDefault();activity=new FormData(e.target).get('name').trim()||'Unnamed activity';switching=false;scene='task';completed=false;checked=[false,false,false];render()};render();
</script></html>
