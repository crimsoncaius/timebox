<!doctype html>
<!-- THROWAWAY: Which of three Android task layouts removes whitespace while preserving usable controls? -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task card spacing prototype · #127</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141413;color:#e6e3df;font:14px Arial,sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button{background:none;border:0;min-height:48px}aside{max-width:760px;margin:28px auto 20px;padding:0 20px}h1{font-size:22px;margin:8px 0}p{color:#aaa7a2;line-height:1.5}.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap}select{background:#252420;padding:8px;border:1px solid #555;border-radius:8px}.phone{width:390px;max-width:100%;margin:auto;background:#0c0b09;min-height:610px;padding:22px 12px 28px}.header{display:flex;justify-content:space-between;padding:0 12px}.tabs{display:flex;justify-content:space-around;color:#aaa7a2;padding:22px 0}.tabs span:first-child{color:#eee;text-decoration:underline;text-underline-offset:10px}.card{background:#1d1c19;border:1px solid #383631;border-radius:14px;margin-bottom:8px;padding:3px 0;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:start}.check,.more{width:44px;min-width:44px;padding:0;color:#a5a29b;font-size:23px}.check span{display:inline-block;width:17px;height:17px;border:2px solid #a5a29b;border-radius:50%;font-size:11px}.done .title{text-decoration:line-through;color:#999}.done .check span{background:#8a9c83}.title{font-weight:600;line-height:21px;overflow-wrap:anywhere;padding-top:13px}.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;color:#aaa7a2;font-size:12px}.blocked{font-size:10px;color:#e9a496;background:#392720;border-radius:4px;padding:4px 7px;letter-spacing:1px}.plan{padding:0;white-space:nowrap;font-size:11px;color:#aaa7a2}.plan span{display:inline-block;border:1px solid #454039;border-radius:20px;padding:5px 10px}.plan.ready{color:#e8cf76}.plan.ready span{border-color:#675731;background:#30291b}.lower{grid-column:2/4;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 8px;padding-right:10px;min-width:0}.lower .plan{margin-left:auto}.B .card{grid-template-columns:44px minmax(0,1fr) auto 40px;padding:6px 0}.B .title{padding-top:6px}.B .content{align-self:center}.B .meta{padding:5px 0}.B .plan{padding:0 3px}.B .more{width:40px;min-width:40px}.C .card{border:0;border-bottom:1px solid #37332c;border-radius:0;background:transparent;margin:0;padding:7px 0;grid-template-columns:44px minmax(0,1fr) 48px 40px}.C .content{align-self:center}.C .title{padding-top:4px}.C .meta{padding:6px 0}.C .plan{font-size:19px}.C .plan span{border-radius:9px;padding:4px 8px}.C .more{min-width:40px;width:40px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#eee8d9;color:#24231f;border-radius:40px;box-shadow:0 6px 30px #0008;padding:0 8px;white-space:nowrap}.switcher button{font-size:24px;width:48px}.foot{max-width:760px;margin:16px auto 110px;padding:0 20px;font-size:12px;color:#aaa}#state{white-space:pre-wrap}dialog{background:#292721;color:#eee;border:1px solid #555;border-radius:15px}dialog::backdrop{background:#0007}
.A .check{grid-column:1;grid-row:1/3}.A .more{grid-column:3;grid-row:1/3}.A .title{grid-column:2;grid-row:1}.A .lower{grid-column:2;grid-row:2;padding-right:0}</style>
<aside><small>THROWAWAY PROTOTYPE · ISSUE #127 · ANDROID LAYOUT STUDY</small><h1 id="name"></h1><p id="description"></p><div class="tools"><label>Width <select id="width"><option>390</option><option>320</option><option>480</option></select></label><label><input id="stress" type="checkbox" checked> Include long title and metadata</label></div></aside>
<main class="phone"><div class="header"><strong>Battle Plan</strong><span>＋</span></div><div class="header" style="margin-top:24px"><span>▤ &nbsp; Admin ⌄</span><span>☰</span></div><div class="tabs"><span>Open</span><span>In Progress 0</span><span>Completed 2</span></div><section id="cards"></section></main>
<div class="foot"><p id="measure"></p><details><summary>Prototype state (local only)</summary><pre id="state"></pre></details></div>
<nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><strong id="label"></strong><button id="next" aria-label="Next variant">→</button></nav>
<dialog><p>Task actions · prototype</p><button onclick="this.closest('dialog').close()">Close</button></dialog>
<script type="module">
const variants=['A','B','C'];let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';
const names={A:'Shared second row',B:'Planning beside the title',C:'Dense list with planning icon'};
const descriptions={A:'Keep the full planning label. Metadata and planning share the lower row, beneath the title.',B:'Move planning into the title row. Short tasks become one-row cards; long titles get less horizontal space.',C:'Remove individual card containers and use a compact planning icon. Highest density, with less explicit action wording.'};
const tasks=[{title:'Fill up form',ready:false},{title:'x',blocked:true,ready:false},{title:'Test',date:'9 Sep',ready:true},{title:'Prepare the application documents and confirm the final details with the team',date:'12 Sep',blocked:true,subtasks:'2/5',ready:false}];
const cards=document.querySelector('#cards');
function render(){document.querySelector('.phone').className='phone '+variant;document.querySelector('.phone').style.width=document.querySelector('#width').value+'px';document.querySelector('#name').textContent=names[variant];document.querySelector('#description').textContent=descriptions[variant];document.querySelector('#label').textContent=variant+' — '+names[variant];cards.innerHTML='';
tasks.slice(0,document.querySelector('#stress').checked?4:3).forEach((t,i)=>{let card=document.createElement('article');card.className='card'+(t.done?' done':'');let meta=`<div class="meta">${t.blocked?'<span class="blocked">BLOCKED</span>':''}${t.subtasks?'<span>☷ '+t.subtasks+'</span>':''}${t.date?'<span>▦ '+t.date+'</span>':''}</div>`;let plan=`<button class="plan ${t.ready?'ready':''}" aria-label="${t.ready?'Remove from':'Add to'} Ready to Plan" aria-pressed="${t.ready}"><span>${variant==='C'?(t.ready?'✓':'+'):(t.ready?'Ready to Plan →':'Add to Plan +')}</span></button>`;let title=`<div class="title"></div>`;let more='<button class="more" aria-label="Task actions">⋮</button>';card.innerHTML='<button class="check" aria-label="Toggle completion"><span>'+(t.done?'✓':'')+'</span></button>'+(variant==='A'?title+more+'<div class="lower">'+meta+plan+'</div>':'<div class="content">'+title+meta+'</div>'+plan+more);card.querySelector('.title').textContent=t.title;card.querySelector('.plan').onclick=()=>{t.ready=!t.ready;render()};card.querySelector('.check').onclick=()=>{t.done=!t.done;render()};card.querySelector('.more').onclick=()=>document.querySelector('dialog').showModal();cards.append(card)});
document.querySelector('#state').textContent=JSON.stringify({variant,width:document.querySelector('#width').value,tasks},null,2);requestAnimationFrame(()=>document.querySelector('#measure').textContent='Rendered card heights: '+[...cards.children].map(c=>Math.round(c.getBoundingClientRect().height)+'px').join(' · ')+'. Controls reserve at least 48px vertically. Browser approximation; final Compose layout needs native review.');}
function cycle(n){variant=variants[(variants.indexOf(variant)+n+3)%3];let url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.querySelector('#previous').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#width').onchange=render;document.querySelector('#stress').onchange=render;document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]')||document.querySelector('dialog').open)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></html>
